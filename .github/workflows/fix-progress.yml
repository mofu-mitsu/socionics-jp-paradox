# Temporary workflow used to repair the progress calculation.
name: Fix quiz progress bar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-progress:
    if: "!contains(github.event.head_commit.message, 'fix: repair quiz progress bar')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch progress calculation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text()

          old = '''  const getProgressPercentage = () => {
    if (step === "result") return 100;
    if (step === "approximate") {
      return 75 + Math.round((approximateQIndex / 5) * 24);
    }
    if (step === "quiz") {
      const match = currentQId.match(/^q(\\d+)$/);
      if (match) {
        const num = parseInt(match[1]);
        return Math.round((num / 12) * 60); // q1~q12 for 0-60%
      }
      const splitMatch = currentQId.match(/split_(\\d+)/);
      if (splitMatch) {
        const num = parseInt(splitMatch[1]);
        return 60 + Math.round((num / 5) * 15);
      }
      const perceptionMatch = currentQId.match(/perception_(\\d+)/);
      if (perceptionMatch) {
        const num = parseInt(perceptionMatch[1]);
        return 60 + Math.round((num / 2) * 15);
      }
      if (currentQId.includes("q_romantic_style") || currentQId.includes("q_suggestive_mobilizing") || currentQId.includes("q_mobilizing")) {
        return 60 + 10;
      }
      if (currentQId.includes("q_sle_vs_see") || currentQId.includes("q_see_iee_deep") || currentQId.includes("q_iei_sei_deep") || currentQId.includes("q_eii_esi_deep")) {
        return 60 + 5;
      }
      return 70;
    }
    return 0;
  };'''

          new = '''  // 進行度は質問IDの番号ではなく「実際に何問答えたか」で計算する。
  // q1a / q1b / split系 / 特殊設問など、分岐先のIDを見て計算すると
  // 5%→35%→15%のように進行バーが逆戻りしてしまうため。
  const getProgressPercentage = () => {
    if (step === "result") return 100;

    if (step === "approximate") {
      return Math.min(
        99,
        75 + Math.round((approximateQIndex / Math.max(SOCIONICS_16TYPE_5QUESTIONS_V2.length - 1, 1)) * 24),
      );
    }

    if (step === "quiz") {
      // historyには「現在の質問に来るまでに回答した質問」が1問ずつ入る。
      // 分岐があっても必ず単調増加するので、質問IDの文字列に依存しない。
      const answeredCount = history.length;
      const estimatedTotalQuestions = 20;
      const progress = Math.round(
        ((answeredCount + 1) / estimatedTotalQuestions) * 95,
      );

      return Math.min(95, Math.max(5, progress));
    }

    return 0;
  };'''

          if old not in text:
              raise SystemExit("Target getProgressPercentage block was not found; aborting without changes.")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patched file and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fix-progress.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair quiz progress bar"
          git push