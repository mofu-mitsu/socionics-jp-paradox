name: Apply score and GAS fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')

          old_score = 'score: (rawPosData[ie] || 0) + (ieScores[ie] || 0) * 0.4,'
          new_score = 'score: rawPosData[ie] || 0,'
          if old_score not in text:
              raise SystemExit('Position scoring pattern not found; refusing to modify page.tsx')
          text = text.replace(old_score, new_score, 1)

          old_header = 'headers: { "Content-Type": "application/json" },'
          new_header = '''// application/json は CORS の preflight が発生するため、
                                    // GAS Web アプリへ no-cors で送る場合は text/plain を使用する
                                    headers: { "Content-Type": "text/plain;charset=utf-8" },'''
          if old_header not in text:
              raise SystemExit('GAS Content-Type pattern not found; refusing to modify page.tsx')
          text = text.replace(old_header, new_header, 1)
          page.write_text(text, encoding='utf-8')

          gas = Path('GAS.txt')
          gas_text = gas.read_text(encoding='utf-8')
          marker = '// 許可するためのCORS対応 (Options request)'
          start = gas_text.find(marker)
          if start < 0:
              raise SystemExit('GAS options block not found; refusing to modify GAS.txt')
          replacement = '''// Webアプリの疎通確認用
function doGet(e) {
  return ContentService.createTextOutput(JSON.stringify({ status: "ok" }))
    .setMimeType(ContentService.MimeType.JSON);
}
'''
          gas_text = gas_text[:start] + replacement
          gas.write_text(gas_text, encoding='utf-8')
          PY

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-score-gas.yml
          git add app/page.tsx GAS.txt
          git commit -m "fix: stop global IE scores leaking into Model A positions and fix GAS request"
          git push
